server {
    server_name umutozturk.me www.umutozturk.me;
    root /var/www/umutozturk.me;
    index index.html;

    include snippets/security-headers.conf;
    include snippets/panel.conf;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/security-headers.conf;
        try_files $uri =404;
    }
    # Görseller, yazı tipleri ve sayaç betiği: tarayıcı 30 gün saklasın
    location ~* \.(webp|jpg|jpeg|png|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        include snippets/security-headers.conf;
        try_files $uri =404;
    }
    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        expires 1d;
        include snippets/security-headers.conf;
    }
    location = /a.js {
        expires 1d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        include snippets/security-headers.conf;
    }
    # Site artık önceden çizilmiş sayfalardan oluşuyor (/, /en/): olmayan adres gerçek 404 döner (arama motorları için)
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
    # gizli dosyalar ve sunucu tarafı script'ler hiçbir zaman servis edilmez
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(php|phtml|cgi|pl|sh|env|bak|sql)$ { deny all; }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/umutozturk.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/umutozturk.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.umutozturk.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = umutozturk.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name umutozturk.me www.umutozturk.me;
    return 404; # managed by Certbot




}